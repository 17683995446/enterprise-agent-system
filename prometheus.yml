# Prometheus Configuration for Enterprise Agent System
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'enterprise-agent-system'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "alerts/*.yml"

scrape_configs:
  # Prometheus自我监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # FastAPI应用监控
  - job_name: 'enterprise-agent-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'api'
          env: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis监控
  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:6379']
        labels:
          service: 'redis'
    scrape_interval: 30s

  # Celery Worker监控
  - job_name: 'celery-worker'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'celery'
    metrics_path: '/metrics/celery'
    scrape_interval: 15s

  # Node Exporter (系统资源)
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 30s
