# Docker Compose for Enterprise Agent System
# ==============================================

version: '3.8'

services:
  # Redis - Message Broker and Cache
  redis:
    image: redis:7-alpine
    container_name: enterprise-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-network

  # Celery Worker - Distributed Task Processing
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: enterprise-agent-celery-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app/src
    command: celery -A enterprise_agent_system.infrastructure.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - agent-network

  # Celery Beat - Periodic Task Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: enterprise-agent-celery-beat
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app/src
    command: celery -A enterprise_agent_system.infrastructure.celery_app beat --loglevel=info
    volumes:
      - ./src:/app/src
    networks:
      - agent-network

  # Flower - Celery Monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: enterprise-agent-flower
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    ports:
      - "5555:5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app/src
    command: celery -A enterprise_agent_system.infrastructure.celery_app flower --port=5555
    volumes:
      - ./src:/app/src
    networks:
      - agent-network

  # FastAPI - REST API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: enterprise-agent-api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
    command: uvicorn enterprise_agent_system.infrastructure.api.api_server:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agent-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: enterprise-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - agent-network

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise-agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - agent-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  agent-network:
    driver: bridge
