# Configuration System
# 企业级 Agent 系统配置文件

# LLM 配置
llm:
  provider: "silicon_flow"
  api_key: "${SILICON_FLOW_API_KEY:-sk-uqelhavcdhfxjzjesdenxpbtqombamjniazzjtbssmdcwdvg}"
  base_url: "https://api.siliconflow.cn/v1"
  model: "Qwen/Qwen2.5-7B-Instruct"
  temperature: 0.7
  max_tokens: 4096
  timeout: 60
  retry_attempts: 3
  enable_cache: true
  cache_ttl: 3600

# API 服务配置
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins:
    - "*"
  rate_limit:
    enabled: true
    requests_per_minute: 100

# 数据库配置
database:
  url: "${DATABASE_URL:-sqlite:///data/enterprise_agent.db}"
  echo: false
  pool_size: 20
  max_overflow: 10

# 缓存配置
cache:
  type: "memory"
  redis_url: "${REDIS_URL:-redis://localhost:6379/0}"
  default_ttl: 3600

# 日志配置
logging:
  level: "INFO"
  format: "json"
  file: "/var/log/enterprise_agent/app.log"
  max_size: "100MB"
  backup_count: 10

# 分析配置
analysis:
  default_depth: "deep"
  include_security: true
  include_performance: true
  include_best_practices: true
  batch_size: 50

# RAG 系统配置
rag:
  enabled: true
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 5
  vector_store: "memory"

# 监控配置
monitoring:
  enabled: true
  prometheus:
    port: 9090
  grafana:
    enabled: true
    url: "http://localhost:3000"

# 存储配置
storage:
  upload_dir: "./uploads"
  report_dir: "./reports"
  data_dir: "./data"
